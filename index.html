<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>9th English Past Papers</title>
  <meta name="description" content="9th Class English, Lahore Board past papers 2022 to 2026 (Group I and Group II). Practise Q.8 Urdu to English translation and Q.9 change the voice, with every repeated question." />
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#141415" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="English Papers" />
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    try { const t = localStorage.getItem("lb9-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/home" aria-label="Home">
      <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
        <path class="bm-sheet" d="M14 0h30l20 20v30a14 14 0 0 1-14 14H14A14 14 0 0 1 0 50V14A14 14 0 0 1 14 0z"/>
        <path class="bm-fold" d="M44 0v12a8 8 0 0 0 8 8h12z"/>
        <g class="bm-nine" fill="none" stroke-width="7.5" stroke-linecap="round">
          <circle cx="29" cy="28" r="9.75"/>
          <path d="M38.75 28v8c0 10-6.5 15.75-16.5 15.75"/>
        </g>
      </svg>
      <span class="brand-text">English Papers</span>
    </a>
    <div class="topbar-actions">
      <a class="icon-btn" href="assets/Past_papers.pdf" download aria-label="Download PDF"><i class="ph ph-download-simple" aria-hidden="true"></i></a>
      <button class="icon-btn theme-toggle" type="button" aria-label="Switch colour theme"><i class="ph ph-moon" aria-hidden="true"></i></button>
    </div>
  </header>

  <main id="app">
    <!-- HOME -->
    <section class="view" id="view-home" data-view="home" aria-labelledby="hero-title">
      <div class="hero">
        <div class="hero-copy">
          <h1 id="hero-title"></h1>
          <p class="hero-sub" id="hero-sub"></p>
          <p class="hero-qs" id="hero-qs"></p>
          <div class="hero-ctas">
            <a class="btn btn-primary" href="#/practice"><i class="ph ph-cards" aria-hidden="true"></i><span>Start practice</span></a>
            <a class="btn btn-ghost" href="#/papers"><span>Browse papers</span></a>
          </div>
        </div>
        <a class="preview" href="#/practice" id="preview" aria-label="Most repeated questions. Open practice.">
          <span class="preview-stack" id="preview-stack"></span>
          <span class="preview-foot"><span>Most repeated questions</span><i class="ph ph-arrow-right" aria-hidden="true"></i></span>
        </a>
      </div>

      <div class="progress-card" id="progress-card"></div>

      <div class="block">
        <h2 class="block-title" id="cover-head"></h2>
        <div class="rail" id="paper-rail" role="list"></div>
        <p class="cover-note" id="cover-note"></p>
      </div>
      <p class="footer-text" id="footer-text"></p>
    </section>

    <!-- PAPERS -->
    <section class="view" id="view-papers" data-view="papers" hidden aria-label="Papers">
      <div class="view-head">
        <h2 class="view-title">Papers</h2>
        <label class="search">
          <span class="sr-only">Search all papers</span>
          <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
          <input id="search" type="search" placeholder="Search all papers" autocomplete="off" enterkeyhint="search" />
        </label>
      </div>

      <div id="paper-mode">
        <div class="chip-rail" id="paper-chips" aria-label="Choose a paper"></div>
        <div class="swipe-zone" id="swipe-zone">
          <div class="paper" id="paper"></div>
        </div>
        <div class="pager">
          <button class="btn btn-ghost btn-sm" id="prev" type="button"><i class="ph ph-arrow-left" aria-hidden="true"></i><span>Previous</span></button>
          <span class="pager-count" id="pager-count"></span>
          <button class="btn btn-ghost btn-sm" id="next" type="button"><span>Next</span><i class="ph ph-arrow-right" aria-hidden="true"></i></button>
        </div>
      </div>

      <div id="search-mode" hidden>
        <p class="meta-line" id="search-count" aria-live="polite"></p>
        <div id="search-results"></div>
      </div>
    </section>

    <!-- PRACTICE -->
    <section class="view" id="view-practice" data-view="practice" hidden aria-label="Practice">
      <div class="view-head">
        <h2 class="view-title">Practice</h2>
        <div class="segmented" id="deck-filter" aria-label="Choose questions">
          <button type="button" data-deck="q8">Q.8</button>
          <button type="button" data-deck="q9">Q.9</button>
          <button type="button" data-deck="rep">Repeated</button>
        </div>
      </div>
      <p class="meta-line" id="deck-count" aria-live="polite"></p>
      <div class="deck" id="deck"></div>
      <div class="deck-actions">
        <button class="round-btn" id="again" type="button" aria-label="See it again later"><i class="ph ph-arrow-counter-clockwise" aria-hidden="true"></i></button>
        <button class="round-btn" id="shuffle" type="button" aria-label="Shuffle"><i class="ph ph-shuffle" aria-hidden="true"></i></button>
        <button class="round-btn round-btn-primary" id="gotit" type="button" aria-label="I can do this one"><i class="ph ph-check" aria-hidden="true"></i></button>
      </div>
      <p class="deck-help">Swipe right if you can do it, left to see it again later</p>
    </section>

    <!-- REPEATED -->
    <section class="view" id="view-repeated" data-view="repeated" hidden aria-labelledby="rep-title">
      <div class="view-head">
        <h2 class="view-title" id="rep-title"></h2>
        <p class="view-lead" id="rep-intro"></p>
        <div class="segmented" id="rep-filter" aria-label="Repeated question type">
          <button type="button" data-rep="q8">Q.8</button>
          <button type="button" data-rep="q9">Q.9</button>
          <button type="button" data-rep="topics">Topics</button>
        </div>
      </div>
      <h3 class="list-title" id="rep-list-title"></h3>
      <div class="rep-list" id="rep-list"></div>
      <p class="meta-line" id="rep-note"></p>
    </section>
  </main>

  <nav class="tabbar" aria-label="Main">
    <svg class="tabbar-bg" aria-hidden="true" focusable="false"><path /></svg>
    <a class="tab" href="#/home" data-tab="home"><i class="ph ph-house" data-icon="house" aria-hidden="true"></i><span>Home</span></a>
    <a class="tab" href="#/papers" data-tab="papers"><i class="ph ph-files" data-icon="files" aria-hidden="true"></i><span>Papers</span></a>
    <span class="tab-gap" aria-hidden="true"></span>
    <a class="tab" href="#/repeated" data-tab="repeated"><i class="ph ph-repeat" data-icon="repeat" aria-hidden="true"></i><span>Repeated</span></a>
    <a class="tab" href="#/papers/search" data-tab="search"><i class="ph ph-magnifying-glass" data-icon="magnifying-glass" aria-hidden="true"></i><span>Search</span></a>
    <a class="fab" href="#/practice" data-tab="practice" aria-label="Practice"><i class="ph ph-cards" aria-hidden="true"></i></a>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
