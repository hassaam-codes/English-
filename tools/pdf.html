<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>9th Class English — Lahore Board — Past Papers 2022 to 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet" />
<style>
  @page { size: A4; margin: 16mm 16mm 20mm; }
  :root { --ink: #171717; --ink-2: #525252; --muted: #6e6e73; --line: #e4e4e7; --blue: #1d4ed8; --blue-soft: #eef2fe; --raised: #f6f6f7; --alp-bg: #fdf0c2; --alp-ink: #5a4300; }
  * { box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { margin: 0; font-family: "Geist", system-ui, sans-serif; font-size: 10.5pt; line-height: 1.45; color: var(--ink); }
  .ur { font-family: "Noto Nastaliq Urdu", serif; direction: rtl; unicode-bidi: isolate; }
  .mono { font-family: "Geist Mono", monospace; }
  .page { break-before: page; }
  .page:first-child { break-before: auto; }
  .alp { display: inline-block; font-size: 7.5pt; font-weight: 600; padding: 1.5pt 6pt; border-radius: 4pt; background: var(--alp-bg); color: var(--alp-ink); white-space: nowrap; }
  .rep { display: inline-block; font-size: 7.5pt; font-weight: 500; padding: 1pt 6pt; border-radius: 4pt; background: var(--blue-soft); color: var(--blue); white-space: nowrap; }

  /* Cover */
  .cover { display: flex; flex-direction: column; min-height: 255mm; }
  .cover-brand { display: flex; align-items: center; gap: 8pt; font-weight: 500; font-size: 12pt; }
  .cover-brand svg { width: 26pt; height: 26pt; }
  .cover-main { margin-top: 52mm; }
  .cover h1 { font-size: 35pt; line-height: 1.04; letter-spacing: -0.03em; font-weight: 500; margin: 0 0 12pt; white-space: nowrap; }
  .cover .sub { font-size: 15pt; color: var(--ink-2); margin: 0 0 4pt; }
  .cover .qs { font-size: 12pt; color: var(--ink-2); margin: 0; }
  .cover .qs b { color: var(--ink); font-weight: 500; }
  .cover-rule { width: 40pt; height: 3pt; border-radius: 2pt; background: var(--blue); margin: 22pt 0; }
  .cover-box { margin-top: auto; }
  .cover-box h2 { font-size: 11.5pt; font-weight: 500; margin: 0 0 10pt; }
  .tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7pt; }
  .tile { border: 1px solid var(--line); border-radius: 10pt; padding: 10pt; min-height: 62pt; display: flex; flex-direction: column; justify-content: space-between; gap: 4pt; }
  .tile .y { font-size: 19pt; font-weight: 500; line-height: 1; letter-spacing: -0.02em; }
  .tile .g { color: var(--ink-2); font-size: 9.5pt; }
  .tile .pg { font-family: "Geist Mono", monospace; font-size: 7.5pt; color: var(--muted); }
  .cover-note { margin: 12pt 0 0; font-size: 9.5pt; color: var(--ink-2); }
  .cover-note strong { color: var(--ink); font-weight: 500; }

  /* Paper */
  .p-head { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 12pt; padding-bottom: 10pt; border-bottom: 1px solid var(--line); }
  .p-year { font-size: 44pt; line-height: 0.95; font-weight: 500; letter-spacing: -0.03em; }
  .p-year span { font-size: 17pt; color: var(--ink-2); letter-spacing: 0; margin-left: 4pt; }
  .p-mark { display: flex; flex-direction: column; align-items: flex-end; gap: 6pt; }
  .p-mark svg { width: 22pt; height: 22pt; }
  .p-title { margin: 10pt 0 2pt; font-size: 12.5pt; font-weight: 500; }
  .p-meta { margin: 0; font-size: 8pt; color: var(--muted); line-height: 1.5; }
  .q { margin-top: 14pt; }
  .q-head { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8pt; margin-bottom: 4pt; break-after: avoid; }
  .q-badge { font-family: "Geist Mono", monospace; font-size: 9pt; font-weight: 500; background: var(--blue); color: #fff; padding: 2pt 6pt; border-radius: 5pt; }
  .q-head b { font-size: 11pt; font-weight: 500; }
  .q-head .marks { font-family: "Geist Mono", monospace; font-size: 8.5pt; color: var(--muted); }
  .rows { border: 1px solid var(--line); border-radius: 10pt; overflow: hidden; }
  .row { display: grid; grid-template-columns: 26pt 1fr auto; align-items: center; gap: 6pt; padding: 3pt 10pt; break-inside: avoid; }
  .row + .row { border-top: 1px solid var(--line); }
  .row .n { font-family: "Geist Mono", monospace; font-size: 8pt; color: var(--muted); }
  .row .ur { font-size: 12.5pt; line-height: 2.05; text-align: right; }
  .row .en { font-size: 11pt; padding: 3.5pt 0; }
  .row.is-rep { background: #fafbff; }
  .alt { margin-top: 10pt; padding: 9pt 12pt; border-radius: 10pt; background: var(--raised); break-inside: avoid; }
  .alt .h { margin: 0 0 3pt; font-size: 8.5pt; color: var(--ink-2); }
  .alt .t { margin: 0; display: flex; justify-content: space-between; align-items: center; gap: 10pt; font-size: 11pt; font-weight: 500; }
  .alt .t .marks { font-family: "Geist Mono", monospace; font-size: 8.5pt; color: var(--muted); font-weight: 400; }

  /* Repeated */
  .r-title { font-size: 22pt; white-space: nowrap; line-height: 1.1; letter-spacing: -0.02em; font-weight: 500; margin: 0 0 8pt; }
  .r-intro { margin: 0 0 4pt; color: var(--ink-2); font-size: 10pt; max-width: 150mm; }
  .r-intro strong { color: var(--ink); font-weight: 500; }
  .r-sec { margin: 16pt 0 6pt; font-size: 12pt; font-weight: 500; break-after: avoid; }
  /* No outer box, so the table can continue cleanly onto the next page. */
  table { width: 100%; border-collapse: collapse; font-size: 10pt; border-bottom: 1px solid var(--line); }
  th { text-align: left; font-weight: 500; font-size: 8.5pt; color: var(--muted); padding: 6pt 10pt; background: var(--raised); }
  td { padding: 5pt 10pt; border-top: 1px solid var(--line); vertical-align: middle; }
  tr { break-inside: avoid; }
  td.times, th.times { text-align: center; width: 46pt; }
  td.times { font-size: 13pt; font-weight: 500; color: var(--blue); }
  td.in { width: 226pt; color: var(--ink-2); font-size: 9pt; }
  td.ur { font-size: 12.5pt; line-height: 2.05; text-align: right; }
  .swap { color: var(--muted); padding: 0 3pt; }
  .r-note { margin: 8pt 0 0; font-size: 8.5pt; color: var(--muted); }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
  import { COVER, PAPERS, REPEATED, Q8_HEADING, Q9_HEADING, ALT_HEADING, ROMAN } from "../js/data.js";
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const LOGO = `<svg viewBox="0 0 64 64"><path fill="#1d4ed8" d="M14 0h30l20 20v30a14 14 0 0 1-14 14H14A14 14 0 0 1 0 50V14A14 14 0 0 1 14 0z"/><path fill="#8fb0ff" d="M44 0v12a8 8 0 0 0 8 8h12z"/><g fill="none" stroke="#fff" stroke-width="7.5" stroke-linecap="round"><circle cx="29" cy="28" r="9.75"/><path d="M38.75 28v8c0 10-6.5 15.75-16.5 15.75"/></g></svg>`;
  const repMap = new Map();
  for (const row of [...REPEATED.q8, ...REPEATED.q9]) for (const s of row.items) repMap.set(s, row);
  const topicMap = new Map(REPEATED.topics.map((r) => [r.items[0], r]));
  const topicOf = (alt) => (alt.match(/“(.+)”/) || [])[1];
  const tag = (r) => (r ? `<span class="rep">Repeated ${r.times}×</span>` : "<span></span>");

  const cover = `<section class="page cover">
    <div class="cover-brand">${LOGO}<span>English Papers</span></div>
    <div class="cover-main">
      <h1>${esc(COVER.title)}</h1>
      <p class="sub">${esc(COVER.subtitle)}</p>
      <p class="qs"><b>Q.8</b> ${esc(COVER.q8)} &nbsp;•&nbsp; <b>Q.9</b> ${esc(COVER.q9)}</p>
      <div class="cover-rule"></div>
    </div>
    <div class="cover-box">
      <h2>${esc(COVER.boxHeading)}</h2>
      <div class="tiles">${PAPERS.map((p) => `<div class="tile">
        <div><div class="y">${p.year}</div>${p.alp ? '<span class="alp" style="margin-top:4pt">NEW COURSE (ALP)</span>' : ""}</div>
        <div><div class="g">Group ${p.group}</div><div class="pg">Page ${p.page}</div></div></div>`).join("")}</div>
      <p class="cover-note">${COVER.boxNote}</p>
    </div>
  </section>`;

  const rows = (list, cls) => `<div class="rows">${list.map((s, i) => `<div class="row ${repMap.has(s) ? "is-rep" : ""}">
      <span class="n">${ROMAN[i]}</span>
      <span class="${cls}" ${cls === "ur" ? 'lang="ur" dir="rtl"' : ""}>${esc(s)}</span>
      ${tag(repMap.get(s))}</div>`).join("")}</div>`;

  const papers = PAPERS.map((p) => `<section class="page">
    <div class="p-head">
      <div class="p-year">${p.year}<span>Group ${p.group}</span></div>
      <div class="p-mark">${LOGO}${p.alp ? '<span class="alp">NEW COURSE (ALP)</span>' : ""}</div>
    </div>
    <p class="p-title">${esc(p.title)}</p>
    <p class="p-meta">${esc(p.code)}<br />${esc(p.source)}</p>

    <div class="q"><div class="q-head"><span class="q-badge">Q.8</span><b>${esc(Q8_HEADING)}</b><span class="marks">5</span></div>${rows(p.q8, "ur")}</div>
    <div class="alt"><p class="h">${esc(ALT_HEADING)}</p>
      <p class="t"><span>${esc(p.alt)} ${topicMap.get(topicOf(p.alt)) ? tag(topicMap.get(topicOf(p.alt))) : ""}</span><span class="marks">5</span></p></div>
    <div class="q"><div class="q-head"><span class="q-badge">Q.9</span><b>${esc(Q9_HEADING)}</b><span class="marks">5</span></div>${rows(p.q9, "en")}</div>
  </section>`).join("");

  const table = (list, urdu) => `<table><thead><tr><th>Question item</th><th class="times">Times</th><th>Appeared in</th></tr></thead><tbody>${list.map((r) => `<tr>
      <td class="${urdu ? "ur" : ""}" ${urdu ? 'lang="ur" dir="rtl"' : ""}>${r.items.map(esc).join('<span class="swap">⇄</span>')}</td>
      <td class="times">${r.times}×</td><td class="in">${esc(r.in)}</td></tr>`).join("")}</tbody></table>`;

  const repeated = `<section class="page">
    <h1 class="r-title">${esc(REPEATED.title)}</h1>
    <p class="r-intro">${REPEATED.intro}</p>
    <h2 class="r-sec">${esc(REPEATED.q8Title)}</h2>${table(REPEATED.q8, true)}
    <h2 class="r-sec">${esc(REPEATED.q9Title)}</h2>${table(REPEATED.q9)}
    <p class="r-note">${esc(REPEATED.note)}</p>
    <h2 class="r-sec">${esc(REPEATED.topicTitle)}</h2>${table(REPEATED.topics)}
  </section>`;

  document.getElementById("root").innerHTML = cover + papers + repeated;
  await document.fonts.ready;
  window.__ready = true;
</script>
</body>
</html>
